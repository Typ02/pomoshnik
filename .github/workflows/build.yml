name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack bundle
        run: |
          if [ -f bundle.b64 ]; then
            base64 -d bundle.b64 | tar xJ
            git rm -q --cached bundle.b64
            rm bundle.b64
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -q -m "Unpack sources"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Dopomogach.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          sleep 3
          gh release create latest Dopomogach.apk --target "$(git rev-parse HEAD)" --title "Dopomogach build ${{ github.run_number }}" --notes "Auto build" --latest
